<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box} body{margin:0;background:#090d18;font-family:"Microsoft YaHei",sans-serif;color:#eaf1ff}
.root{position:relative;width:1920px;height:1080px;background:#090d18;overflow:hidden}
.panel{background:#121a2b;border:2px solid #273654;border-radius:18px}
.top{position:absolute;left:32px;right:32px;top:24px;height:112px;display:flex;align-items:center;padding:16px 24px;gap:18px}
.brand{width:260px}.title{font-size:36px;font-weight:800;color:#79dcff}.sub{font-size:16px;color:#8093b7}
.stat{height:76px;min-width:145px;padding:12px 18px;background:#0d1424;border:1px solid #314566;border-radius:12px}.label{font-size:14px;color:#8297bb}.value{font-size:27px;font-weight:800;color:#fff}
.boardPanel{position:absolute;left:32px;top:158px;width:1330px;height:858px;padding:24px}
.boardHead{height:64px;display:flex;justify-content:space-between;align-items:center}.boardTitle{font-size:25px;font-weight:700}.hint{font-size:16px;color:#8297bb}
.grid{position:absolute;left:25px;top:100px;width:1280px;height:732px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:12px}
.card{position:relative;background:#18243b;border:2px solid #385078;border-radius:14px;color:#d9e6ff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 24px #0d1424}
.side{position:absolute;right:32px;top:158px;width:494px;height:858px;padding:22px}
.side h2{margin:0 0 14px;font-size:22px}.action{width:100%;height:60px;margin-bottom:12px;border-radius:12px;border:1px solid #397b9e;background:#17364b;color:#8ee6ff;font-size:20px;font-weight:700}
.section{margin-top:18px;padding-top:18px;border-top:1px solid #2a3957}.row{height:38px;display:flex;justify-content:space-between;align-items:center;color:#9fb2d2}.row strong{color:#fff}.log{height:190px;padding:14px;background:#0c1322;border-radius:12px;color:#9fb2d2;font-size:16px;line-height:1.7}
.reward{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(3,6,12,.82);display:flex;align-items:center;justify-content:center}.rewardBox{width:1120px;height:520px;padding:34px}.rewardTitle{text-align:center;font-size:34px;font-weight:800}.rewardCards{display:flex;gap:24px;margin-top:34px}.rewardCard{flex:1;height:320px;border-radius:18px;border:2px solid #4a73a8;background:#17243b;color:#fff;font-size:22px}
</style>
</head>
<body>
<div class="root" data-u-type="div" data-u-name="LeiPaiMainUI" data-u-layout="stretch" data-u-safe-area="true">
  <div class="panel top" data-u-type="div" data-u-name="m_go_TopBar" data-u-layout="top-bar">
    <div class="brand" data-u-type="div" data-u-name="m_go_Brand"><div class="title" data-u-type="text" data-u-name="m_tmp_Title">雷牌</div><div class="sub" data-u-type="text" data-u-name="m_tmp_Subtitle">牌面之下，皆是选择</div></div>
    <div class="stat" data-u-type="div" data-u-name="m_go_StageStat"><div class="label" data-u-type="text" data-u-name="m_tmp_StageLabel">当前关卡</div><div class="value" data-u-type="text" data-u-name="m_tmp_Stage">1 / 3</div></div>
    <div class="stat" data-u-type="div" data-u-name="m_go_ScoreStat"><div class="label" data-u-type="text" data-u-name="m_tmp_ScoreLabel">分数 / 目标</div><div class="value" data-u-type="text" data-u-name="m_tmp_Score">0 / 240</div></div>
    <div class="stat" data-u-type="div" data-u-name="m_go_TurnStat"><div class="label" data-u-type="text" data-u-name="m_tmp_TurnLabel">剩余回合</div><div class="value" data-u-type="text" data-u-name="m_tmp_Turn">24</div></div>
    <div class="stat" data-u-type="div" data-u-name="m_go_ShieldStat"><div class="label" data-u-type="text" data-u-name="m_tmp_ShieldLabel">护盾</div><div class="value" data-u-type="text" data-u-name="m_tmp_Shield">3</div></div>
    <div class="stat" data-u-type="div" data-u-name="m_go_ScoutStat"><div class="label" data-u-type="text" data-u-name="m_tmp_ScoutLabel">侦察</div><div class="value" data-u-type="text" data-u-name="m_tmp_Scout">3</div></div>
  </div>
  <div class="panel boardPanel" data-u-type="div" data-u-name="m_go_BoardPanel" data-u-layout="center">
    <div class="boardHead" data-u-type="div" data-u-name="m_go_BoardHeader"><div class="boardTitle" data-u-type="text" data-u-name="m_tmp_BoardTitle">6 × 6 雷牌阵列</div><div class="hint" data-u-type="text" data-u-name="m_tmp_Hint">左键翻牌 · 右键标记 · 侦察模式查看卡牌</div></div>
    <div class="grid" data-u-type="div" data-u-name="m_grid_Board">
      <button class="card" data-u-type="button" data-u-name="m_btn_Card00">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card01">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card02">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card03">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card04">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card05">?</button>
      <button class="card" data-u-type="button" data-u-name="m_btn_Card06">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card07">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card08">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card09">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card10">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card11">?</button>
      <button class="card" data-u-type="button" data-u-name="m_btn_Card12">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card13">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card14">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card15">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card16">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card17">?</button>
      <button class="card" data-u-type="button" data-u-name="m_btn_Card18">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card19">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card20">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card21">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card22">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card23">?</button>
      <button class="card" data-u-type="button" data-u-name="m_btn_Card24">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card25">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card26">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card27">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card28">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card29">?</button>
      <button class="card" data-u-type="button" data-u-name="m_btn_Card30">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card31">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card32">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card33">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card34">?</button><button class="card" data-u-type="button" data-u-name="m_btn_Card35">?</button>
    </div>
  </div>
  <div class="panel side" data-u-type="div" data-u-name="m_go_SidePanel" data-u-layout="right-panel">
    <h2 data-u-type="text" data-u-name="m_tmp_ActionTitle">行动</h2>
    <button class="action" data-u-type="button" data-u-name="m_btn_ScoutMode">开启侦察模式</button>
    <button class="action" data-u-type="button" data-u-name="m_btn_Retry">重试当前牌局</button>
    <div class="section" data-u-type="div" data-u-name="m_go_DeckInfo"><h2 data-u-type="text" data-u-name="m_tmp_DeckTitle">牌局信息</h2><div class="row" data-u-type="div" data-u-name="m_go_RemainRow"><span data-u-type="text" data-u-name="m_tmp_RemainLabel">未翻卡牌</span><strong data-u-type="text" data-u-name="m_tmp_Remain">36</strong></div><div class="row" data-u-type="div" data-u-name="m_go_ChargeRow"><span data-u-type="text" data-u-name="m_tmp_ChargeLabel">收集器蓄能</span><strong data-u-type="text" data-u-name="m_tmp_Charge">0</strong></div><div class="row" data-u-type="div" data-u-name="m_go_CoreRow"><span data-u-type="text" data-u-name="m_tmp_CoreLabel">已激活核心</span><strong data-u-type="text" data-u-name="m_tmp_Core">0</strong></div></div>
    <div class="section" data-u-type="div" data-u-name="m_go_LogSection"><h2 data-u-type="text" data-u-name="m_tmp_LogTitle">最近结算</h2><div class="log" data-u-type="text" data-u-name="m_tmp_Log">等待首次翻牌……</div></div>
    <div class="section" data-u-type="div" data-u-name="m_go_TipSection"><div class="hint" data-u-type="text" data-u-name="m_tmp_SideTip">标记顺序：无 → 疑似地雷 → 疑似核心</div></div>
  </div>
  <div class="reward" data-u-type="div" data-u-name="m_go_RewardPanel" data-u-layout="stretch"><div class="panel rewardBox" data-u-type="div" data-u-name="m_go_RewardBox"><div class="rewardTitle" data-u-type="text" data-u-name="m_tmp_RewardTitle">关卡完成 · 选择一张核心卡</div><div class="rewardCards" data-u-type="div" data-u-name="m_go_RewardCards"><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward0">奖励一</button><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward1">奖励二</button><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward2">奖励三</button></div></div></div>
</div>
</body>
</html>
