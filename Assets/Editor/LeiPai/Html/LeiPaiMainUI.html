<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3e9;font-family:"Microsoft YaHei",sans-serif;color:#252923}.root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f7f3e9}.top{position:absolute;left:48px;right:48px;top:20px;height:72px;display:flex;align-items:center;border-bottom:2px solid #c9c4b8;background:transparent}.stat{height:52px;display:flex;align-items:center;gap:12px;padding:0 26px;border-right:2px solid #c9c4b8;background:transparent}.stat:first-child{padding-left:12px}.stat:last-child{border:0}.icon{font-size:30px}.label{font-size:18px;color:#66665f}.value{font-size:28px;font-weight:800;color:#20251f}.score{width:560px}.scoreValue{font-size:28px;font-weight:800}.progress{position:absolute;left:360px;top:48px;width:430px;height:10px;border:2px solid #85847e;border-radius:9px;background:#efede5}.progressFill{width:62%;height:100%;border-radius:6px;background:#f2c85a}
.boardPanel{position:absolute;left:48px;top:112px;width:1190px;height:900px;background:transparent}.boardHead{position:absolute;left:12px;top:0;width:1110px;height:42px;display:flex;align-items:center;justify-content:space-between;background:transparent}.boardTitle{font-size:24px;font-weight:800}.hint{font-size:17px;color:#646b65}.grid{position:absolute;left:12px;top:52px;width:1110px;height:798px;background:transparent}.card{position:absolute;left:0;top:0;width:170px;height:123px;border-radius:12px;border:2px solid #568d82;background:#dcebe1;color:#292d28;font-size:18px;font-weight:800;box-shadow:0 3px 7px rgba(55,61,52,.16)}.legend{position:absolute;left:12px;bottom:0;width:1110px;height:36px;display:flex;align-items:center;gap:34px;background:transparent;color:#454943;font-size:16px}
.side{position:absolute;right:48px;top:112px;width:600px;height:900px;padding:18px 22px;background:transparent;border-left:2px solid #c9c4b8}.scout{position:absolute;left:56px;top:16px;width:490px;height:82px;border:3px solid #49747c;border-radius:42px;background:#dff3f5;color:#202b2d;font-size:28px;font-weight:800}.section{position:absolute;left:28px;width:544px;border-top:2px solid #d2cdc0;background:transparent}.sectionTitle{position:absolute;left:0;top:12px;width:170px;height:32px;font-size:22px;font-weight:800;text-align:left}.cores{top:122px;height:176px}.coreSlot{position:absolute;top:54px;width:150px;height:104px;border-radius:14px;border:2px solid #c9c4b8;background:#fffaf0;color:#574c32;font-size:18px;font-weight:700}.coreA{left:0;border-color:#e2af38}.coreB{left:172px}.coreC{left:344px}.treasures{top:318px;height:124px}.treasureRow{position:absolute;left:0;top:54px;width:544px;height:58px;display:flex;align-items:center;gap:18px;background:transparent}.treasure{width:58px;height:58px;border-radius:50%;border:2px solid #c9c4b8;background:#fff7dc;color:#9b6b16;font-size:25px;font-weight:800;text-align:center;padding-top:10px}.empty{background:#faf8f1;color:#bdb9ae;border-style:dashed}.settlement{top:462px;height:284px}.log{position:absolute;left:0;top:54px;width:544px;height:144px;padding:15px 18px;border-radius:14px;background:#fffaf1;color:#4a4c47;font-size:19px;line-height:1.75;text-align:left}.total{position:absolute;left:0;bottom:8px;width:544px;height:66px;border-top:2px solid #d2cdc0;color:#dd8212;font-size:34px;font-weight:900;padding-top:14px;text-align:right}.actions{top:770px;height:112px;border:0}.retry{position:absolute;left:0;top:16px;width:250px;height:66px;border-radius:16px;border:2px solid #8a8d83;background:#f5f0e5;color:#3e413b;font-size:20px;font-weight:700}.modeTip{position:absolute;right:0;top:24px;width:270px;height:48px;color:#6d716a;font-size:16px;text-align:right}
.reward{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(247,243,233,.94);display:flex;align-items:center;justify-content:center}.rewardBox{position:relative;width:1120px;height:520px;padding:34px;background:#fffdf7;border:2px solid #a8a396;border-radius:20px}.rewardTitle{text-align:center;font-size:34px;font-weight:800}.rewardCards{display:flex;gap:24px;margin-top:34px;background:transparent}.rewardCard{flex:1;height:320px;border-radius:18px;border:2px solid #d9a62c;background:#fffaf0;color:#2e312c;font-size:22px;font-weight:800}
</style></head><body><div class="root" data-u-type="div" data-u-name="LeiPaiMainUI" data-u-layout="stretch" data-u-safe-area="true">
<div class="top" data-u-type="div" data-u-name="m_go_TopBar" data-u-layout="top-bar">
<div class="stat" data-u-type="div" data-u-name="m_go_StageStat"><span class="icon" data-u-type="text" data-u-name="m_tmp_StageIcon">⚑</span><span class="value" data-u-type="text" data-u-name="m_tmp_Stage">1 / 3</span></div>
<div class="stat score" data-u-type="div" data-u-name="m_go_ScoreStat"><span class="icon" data-u-type="text" data-u-name="m_tmp_ScoreIcon">★</span><span class="label" data-u-type="text" data-u-name="m_tmp_ScoreLabel">累计分数</span><span class="scoreValue" data-u-type="text" data-u-name="m_tmp_Score">0 / 240</span><div class="progress" data-u-type="div" data-u-name="m_go_ScoreProgress"><div class="progressFill" data-u-type="div" data-u-name="m_go_ScoreProgressFill"></div></div></div>
<div class="stat" data-u-type="div" data-u-name="m_go_CoinStat"><span class="icon" data-u-type="text" data-u-name="m_tmp_CoinIcon">◎</span><span class="value" data-u-type="text" data-u-name="m_tmp_Coin">0</span></div><div class="stat" data-u-type="div" data-u-name="m_go_DeckEntry"><span class="icon" data-u-type="text" data-u-name="m_tmp_DeckIcon">▱</span><span class="label" data-u-type="text" data-u-name="m_tmp_DeckKey">Tab</span></div>
<div class="stat" data-u-type="div" data-u-name="m_go_TurnStat"><span class="icon" data-u-type="text" data-u-name="m_tmp_TurnIcon">▣</span><span class="value" data-u-type="text" data-u-name="m_tmp_Turn">24</span></div><div class="stat" data-u-type="div" data-u-name="m_go_ShieldStat"><span class="icon" data-u-type="text" data-u-name="m_tmp_ShieldIcon">♥</span><span class="value" data-u-type="text" data-u-name="m_tmp_Shield">3</span></div><div class="stat" data-u-type="div" data-u-name="m_go_ScoutStat"><span class="label" data-u-type="text" data-u-name="m_tmp_ScoutLabel">侦察</span><span class="value" data-u-type="text" data-u-name="m_tmp_Scout">3</span></div></div>
<div class="boardPanel" data-u-type="div" data-u-name="m_go_BoardPanel" data-u-layout="left-panel"><div class="boardHead" data-u-type="div" data-u-name="m_go_BoardHeader"><div class="boardTitle" data-u-type="text" data-u-name="m_tmp_BoardTitle">再翻一张</div><div class="hint" data-u-type="text" data-u-name="m_tmp_Hint">左键翻牌 · 右键标记 · 悬停查看规则</div></div><div class="grid" data-u-type="div" data-u-name="m_grid_Board"><button class="card" data-u-type="button" data-u-name="m_btn_CardTemplate">卡牌模板</button></div><div class="legend" data-u-type="div" data-u-name="m_go_ClueLegend"><span data-u-type="text" data-u-name="m_tmp_LegendMine">● 红：地雷</span><span data-u-type="text" data-u-name="m_tmp_LegendMixed">● 黄：混合</span><span data-u-type="text" data-u-name="m_tmp_LegendCore">● 绿：核心</span><span data-u-type="text" data-u-name="m_tmp_LegendInput">鼠标左键翻牌 · 右键标记</span></div></div>
<div class="side" data-u-type="div" data-u-name="m_go_SidePanel" data-u-layout="right-panel"><button class="scout" data-u-type="button" data-u-name="m_btn_ScoutMode">⌕　侦察 3 次</button>
<div class="section cores" data-u-type="div" data-u-name="m_go_DeckInfo"><div class="sectionTitle" data-u-type="text" data-u-name="m_tmp_DeckTitle">当前核心</div><button class="coreSlot coreA" data-u-type="button" data-u-name="m_go_RemainRow"><span data-u-type="text" data-u-name="m_tmp_Remain">等待激活</span></button><button class="coreSlot coreB" data-u-type="button" data-u-name="m_go_ChargeRow"><span data-u-type="text" data-u-name="m_tmp_Charge">蓄能 0</span></button><button class="coreSlot coreC" data-u-type="button" data-u-name="m_go_CoreRow"><span data-u-type="text" data-u-name="m_tmp_Core">核心 0</span></button></div>
<div class="section treasures" data-u-type="div" data-u-name="m_go_TreasureSection"><div class="sectionTitle" data-u-type="text" data-u-name="m_tmp_TreasureTitle">宝物</div><div class="treasureRow" data-u-type="div" data-u-name="m_go_TreasureRow"><div class="treasure" data-u-type="text" data-u-name="m_tmp_Treasure0">盾</div><div class="treasure" data-u-type="text" data-u-name="m_tmp_Treasure1">时</div><div class="treasure" data-u-type="text" data-u-name="m_tmp_Treasure2">幸</div><div class="treasure empty" data-u-type="text" data-u-name="m_tmp_Treasure3">—</div><div class="treasure empty" data-u-type="text" data-u-name="m_tmp_Treasure4">—</div></div></div>
<div class="section settlement" data-u-type="div" data-u-name="m_go_LogSection"><div class="sectionTitle" data-u-type="text" data-u-name="m_tmp_LogTitle">本次结算</div><div class="log" data-u-type="text" data-u-name="m_tmp_Log">等待首次翻牌……</div><div class="total" data-u-type="text" data-u-name="m_tmp_LastTotal">总计　0</div></div><div class="section actions" data-u-type="div" data-u-name="m_go_TipSection"><button class="retry" data-u-type="button" data-u-name="m_btn_Retry">重试当前牌局</button><div class="modeTip" data-u-type="text" data-u-name="m_tmp_SideTip">红/黄/绿对应地雷、混合与核心线索</div></div></div>
<div class="reward" data-u-type="div" data-u-name="m_go_RewardPanel" data-u-layout="stretch"><div class="rewardBox" data-u-type="div" data-u-name="m_go_RewardBox"><div class="rewardTitle" data-u-type="text" data-u-name="m_tmp_RewardTitle">关卡完成 · 选择一张奖励</div><div class="rewardCards" data-u-type="div" data-u-name="m_go_RewardCards"><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward0">奖励一</button><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward1">奖励二</button><button class="rewardCard" data-u-type="button" data-u-name="m_btn_Reward2">奖励三</button></div></div></div></div></body></html>
